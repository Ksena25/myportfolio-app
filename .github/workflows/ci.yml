name: My pipeline

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Build image
        run: |
         docker build -t ${{ secrets.DOCKER_USERNAME }}/cimyportfolio:${{ github.run_number }} .
         docker build -t ${{ secrets.DOCKER_USERNAME }}/cimyportfolio .

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Push image to registry
        run: |
         docker push ${{ secrets.DOCKER_USERNAME }}/cimyportfolio:${{ github.run_number }} 
         docker push ${{ secrets.DOCKER_USERNAME }}/cimyportfolio           
          

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: ssh to Linux and run container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
              docker rm -f myportfolio || echo "Container not found, skipping removal."
              docker run -d --name myportfolio -p 8080:80 ${{ secrets.DOCKER_USERNAME }}/cimyportfolio



